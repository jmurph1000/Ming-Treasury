<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gusto Treasury Payment Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#f45d48',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app"></div>

  <script>
    // Mock data
    const mockUsers = [
      { id: '1', name: 'Sarah Chen', email: 'sarah.chen@gusto.com', role: 'ap_staff', status: 'active', department: 'Finance', payment_limit: 50000 },
      { id: '2', name: 'James Park', email: 'james.park@gusto.com', role: 'ap_manager', status: 'active', department: 'Accounting', payment_limit: 250000 },
      { id: '3', name: 'Linda Kim', email: 'linda.kim@gusto.com', role: 'treasury', status: 'active', department: 'Treasury', payment_limit: null },
      { id: '4', name: 'Diego Torres', email: 'diego.torres@gusto.com', role: 'cfo', status: 'active', department: 'Executive', payment_limit: null },
      { id: '5', name: 'John Murphy', email: 'john.murphy@gusto.com', role: 'admin', status: 'active', department: 'IT', payment_limit: null },
    ];

    const mockPayments = [
      { id: '1', reference: 'PAY-20260220-000001', payee: 'Acme Corp', amount: 25000, status: 'pending_approval', type: 'wire', date: '2026-02-20' },
      { id: '2', reference: 'PAY-20260220-000002', payee: 'Tech Solutions', amount: 150000, status: 'approved', type: 'ach', date: '2026-02-20' },
      { id: '3', reference: 'PAY-20260219-000003', payee: 'Office Supplies Inc', amount: 5000, status: 'executed', type: 'ach', date: '2026-02-19' },
      { id: '4', reference: 'PAY-20260219-000004', payee: 'Cloud Services LLC', amount: 75000, status: 'pending_approval', type: 'wire', date: '2026-02-19' },
    ];

    const mockDashboard = {
      pendingApprovals: 12,
      readyToExecute: 5,
      executedToday: 23,
      totalVolume: 2450000,
    };

    const ROLE_LABELS = {
      ap_staff: 'AP Staff',
      ap_manager: 'AP Manager',
      sr_ap_manager: 'Sr. AP Manager',
      treasury: 'Treasury',
      cfo: 'CFO',
      admin: 'Administrator'
    };

    const ROLE_COLORS = {
      ap_staff: 'bg-gray-100 text-gray-800',
      ap_manager: 'bg-blue-100 text-blue-800',
      sr_ap_manager: 'bg-purple-100 text-purple-800',
      treasury: 'bg-green-100 text-green-800',
      cfo: 'bg-amber-100 text-amber-800',
      admin: 'bg-red-100 text-red-800'
    };

    const STATUS_COLORS = {
      draft: 'bg-gray-100 text-gray-800',
      pending_approval: 'bg-yellow-100 text-yellow-800',
      approved: 'bg-blue-100 text-blue-800',
      executed: 'bg-green-100 text-green-800',
      rejected: 'bg-red-100 text-red-800'
    };

    // State
    let currentPage = 'dashboard';
    let currentUser = mockUsers[4]; // John Murphy (admin)

    // Icons as SVG strings
    const icons = {
      home: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>`,
      payments: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>`,
      approvals: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      users: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`,
      settings: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`,
      plus: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>`,
      check: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`,
      clock: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      dollar: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
    };

    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
    }

    function navigate(page) {
      currentPage = page;
      render();
    }

    function renderSidebar() {
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: icons.home },
        { id: 'payments', label: 'Payments', icon: icons.payments },
        { id: 'approvals', label: 'Approvals', icon: icons.approvals, badge: mockDashboard.pendingApprovals },
        { id: 'users', label: 'Users', icon: icons.users },
        { id: 'settings', label: 'Settings', icon: icons.settings },
      ];

      return `
        <div class="w-64 bg-white border-r min-h-screen flex flex-col">
          <div class="p-4 border-b">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">G</div>
              <span class="font-semibold text-gray-900">Treasury</span>
            </div>
          </div>
          <nav class="flex-1 p-4 space-y-1">
            ${navItems.map(item => `
              <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg transition-colors ${currentPage === item.id ? 'bg-primary/10 text-primary' : 'text-gray-600 hover:bg-gray-100'}">
                ${item.icon}
                <span class="flex-1 text-left">${item.label}</span>
                ${item.badge ? `<span class="bg-primary text-white text-xs px-2 py-0.5 rounded-full">${item.badge}</span>` : ''}
              </button>
            `).join('')}
          </nav>
          <div class="p-4 border-t">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 text-sm font-medium">
                ${currentUser.name.split(' ').map(n => n[0]).join('')}
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-gray-900 truncate">${currentUser.name}</p>
                <p class="text-xs text-gray-500 truncate">${ROLE_LABELS[currentUser.role]}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
            <p class="text-gray-500 mt-1">Welcome back, ${currentUser.name.split(' ')[0]}</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-lg shadow-sm border p-6">
              <div class="flex items-center gap-4">
                <div class="p-3 bg-yellow-100 rounded-lg">
                  ${icons.clock}
                </div>
                <div>
                  <p class="text-sm text-gray-500">Pending Approvals</p>
                  <p class="text-2xl font-bold text-gray-900">${mockDashboard.pendingApprovals}</p>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm border p-6">
              <div class="flex items-center gap-4">
                <div class="p-3 bg-blue-100 rounded-lg">
                  ${icons.payments}
                </div>
                <div>
                  <p class="text-sm text-gray-500">Ready to Execute</p>
                  <p class="text-2xl font-bold text-gray-900">${mockDashboard.readyToExecute}</p>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm border p-6">
              <div class="flex items-center gap-4">
                <div class="p-3 bg-green-100 rounded-lg">
                  ${icons.check}
                </div>
                <div>
                  <p class="text-sm text-gray-500">Executed Today</p>
                  <p class="text-2xl font-bold text-gray-900">${mockDashboard.executedToday}</p>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm border p-6">
              <div class="flex items-center gap-4">
                <div class="p-3 bg-primary/10 rounded-lg text-primary">
                  ${icons.dollar}
                </div>
                <div>
                  <p class="text-sm text-gray-500">Total Volume</p>
                  <p class="text-2xl font-bold text-gray-900">${formatCurrency(mockDashboard.totalVolume)}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-sm border">
            <div class="px-6 py-4 border-b flex justify-between items-center">
              <h3 class="font-semibold text-gray-900">Recent Payments</h3>
              <button onclick="navigate('payments')" class="text-primary text-sm hover:underline">View All</button>
            </div>
            <div class="divide-y">
              ${mockPayments.slice(0, 3).map(p => `
                <div class="px-6 py-4 flex items-center justify-between">
                  <div>
                    <p class="font-medium text-gray-900">${p.payee}</p>
                    <p class="text-sm text-gray-500">${p.reference} · ${p.type.toUpperCase()}</p>
                  </div>
                  <div class="text-right">
                    <p class="font-medium text-gray-900">${formatCurrency(p.amount)}</p>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${STATUS_COLORS[p.status]}">${p.status.replace('_', ' ')}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderPayments() {
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-gray-900">Payments</h1>
              <p class="text-gray-500 mt-1">Manage payment requests and track status</p>
            </div>
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
              ${icons.plus}
              New Payment
            </button>
          </div>

          <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-50 border-b">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reference</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Payee</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Amount</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${mockPayments.map(p => `
                  <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-mono text-sm text-gray-900">${p.reference}</td>
                    <td class="px-6 py-4 text-gray-900">${p.payee}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">${formatCurrency(p.amount)}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 bg-gray-100 rounded text-xs uppercase">${p.type}</span></td>
                    <td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${STATUS_COLORS[p.status]}">${p.status.replace('_', ' ')}</span></td>
                    <td class="px-6 py-4 text-gray-500">${p.date}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderApprovals() {
      const pendingPayments = mockPayments.filter(p => p.status === 'pending_approval');
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Approvals</h1>
            <p class="text-gray-500 mt-1">Review and approve pending payment requests</p>
          </div>

          <div class="space-y-4">
            ${pendingPayments.map(p => `
              <div class="bg-white rounded-lg shadow-sm border p-6">
                <div class="flex items-start justify-between">
                  <div>
                    <div class="flex items-center gap-3">
                      <h3 class="font-semibold text-gray-900">${p.payee}</h3>
                      <span class="px-2 py-1 bg-gray-100 rounded text-xs uppercase">${p.type}</span>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">${p.reference}</p>
                    <p class="text-2xl font-bold text-gray-900 mt-2">${formatCurrency(p.amount)}</p>
                  </div>
                  <div class="flex gap-2">
                    <button class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Reject</button>
                    <button class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Approve</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderUsers() {
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-gray-900">User Management</h1>
              <p class="text-gray-500 mt-1">Manage user accounts, roles, and permissions</p>
            </div>
            <button class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
              ${icons.plus}
              Add User
            </button>
          </div>

          <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-50 border-b">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">User</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Department</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Payment Limit</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${mockUsers.map(u => `
                  <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                      <div>
                        <p class="font-medium text-gray-900">${u.name}</p>
                        <p class="text-sm text-gray-500">${u.email}</p>
                      </div>
                    </td>
                    <td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${ROLE_COLORS[u.role]}">${ROLE_LABELS[u.role]}</span></td>
                    <td class="px-6 py-4 text-gray-500">${u.department}</td>
                    <td class="px-6 py-4 text-gray-900">${u.payment_limit ? formatCurrency(u.payment_limit) : 'Unlimited'}</td>
                    <td class="px-6 py-4"><span class="inline-flex items-center gap-1 text-green-600">${icons.check} Active</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
            <p class="text-gray-500 mt-1">Configure system settings and preferences</p>
          </div>

          <div class="grid gap-6">
            <div class="bg-white rounded-lg shadow-sm border p-6">
              <h3 class="font-semibold text-gray-900 mb-4">Batch Processing</h3>
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="font-medium text-gray-900">ACH Cutoff Time</p>
                    <p class="text-sm text-gray-500">Daily cutoff for same-day ACH processing</p>
                  </div>
                  <span class="font-mono bg-gray-100 px-3 py-1 rounded">2:00 PM EST</span>
                </div>
                <div class="flex items-center justify-between">
                  <div>
                    <p class="font-medium text-gray-900">Wire Cutoff Time</p>
                    <p class="text-sm text-gray-500">Daily cutoff for same-day wire transfers</p>
                  </div>
                  <span class="font-mono bg-gray-100 px-3 py-1 rounded">4:00 PM EST</span>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border p-6">
              <h3 class="font-semibold text-gray-900 mb-4">Security</h3>
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="font-medium text-gray-900">Session Timeout</p>
                    <p class="text-sm text-gray-500">Automatic logout after inactivity</p>
                  </div>
                  <span class="font-mono bg-gray-100 px-3 py-1 rounded">30 minutes</span>
                </div>
                <div class="flex items-center justify-between">
                  <div>
                    <p class="font-medium text-gray-900">Dual Control Threshold</p>
                    <p class="text-sm text-gray-500">Require two confirmations above this amount</p>
                  </div>
                  <span class="font-mono bg-gray-100 px-3 py-1 rounded">$100,000</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderContent() {
      switch(currentPage) {
        case 'dashboard': return renderDashboard();
        case 'payments': return renderPayments();
        case 'approvals': return renderApprovals();
        case 'users': return renderUsers();
        case 'settings': return renderSettings();
        default: return renderDashboard();
      }
    }

    function render() {
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen">
          ${renderSidebar()}
          <main class="flex-1 p-8">
            ${renderContent()}
          </main>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
