// --- Utility functions (from dashboard-app.js) ---
function parseTodos(content) {
  if (!content) return [];
  var todoLines = content.split("\n");
  var todos = [];
  for (var idx = 0; idx < todoLines.length; idx++) {
    var todoLine = todoLines[idx];
    var match = todoLine.match(/^[-*]\s+\[([x ])\]\s+(?:\*\*(!!|!)\*\*\s+)?(.+)/i);
    if (match) {
      var done = match[1].toLowerCase() === "x";
      var prio = match[2] === "!!" ? "high" : match[2] === "!" ? "medium" : "low";
      var desc = match[3].trim();
      var due = null;
      var dueM = desc.match(/\[due:\s*([^\]]+)\]/i);
      if (dueM) { due = dueM[1]; desc = desc.replace(dueM[0], "").trim(); }
      var srcM = desc.match(/\[from:\s*([^\]]+)\]/i);
      var src = null;
      if (srcM) { src = srcM[1]; desc = desc.replace(srcM[0], "").trim(); }
      var statusM = desc.match(/\[status:\s*([^\]]+)\]/i);
      var status = statusM ? statusM[1].trim().toLowerCase() : "not-started";
      if (statusM) desc = desc.replace(statusM[0], "").trim();
      todos.push({ done: done, priority: prio, description: desc, due: due, source: src, status: status, lineIndex: idx });
    }
  }
  return todos;
}
function todosToMarkdown(todos) {
  return todos.map(function(t) {
    var check = t.done ? "x" : " ";
    var prioMark = t.priority === "high" ? "**!!** " : t.priority === "medium" ? "**!** " : "";
    var dueMark = t.due ? " [due: " + t.due + "]" : "";
    var srcMark = t.source ? " [from: " + t.source + "]" : "";
    var statusMark = t.status && t.status !== "not-started" ? " [status: " + t.status + "]" : "";
    return "- [" + check + "] " + prioMark + t.description + dueMark + srcMark + statusMark;
  }).join("\n") + "\n";
}
function parseWaiting(content) {
  if (!content) return [];
  return content.split("\n").map(function(line, idx) {
    var m = line.match(/^[-*]\s+\[([x ])\]\s+(.+)/i);
    if (!m) return null;
    var done = m[1].toLowerCase() === "x";
    var desc = m[2].trim();
    var ownerM = desc.match(/\[owner:\s*([^\]]+)\]/i);
    var owner = ownerM ? ownerM[1].trim() : "";
    if (ownerM) desc = desc.replace(ownerM[0], "").trim();
    var sinceM = desc.match(/\[since:\s*([^\]]+)\]/i);
    var since = sinceM ? sinceM[1].trim() : null;
    if (sinceM) desc = desc.replace(sinceM[0], "").trim();
    return { done: done, description: desc, owner: owner, since: since, lineIndex: idx };
  }).filter(Boolean);
}
function waitingToMarkdown(items) {
  return items.map(function(w) {
    var check = w.done ? "x" : " ";
    var ownerTag = w.owner ? " [owner: " + w.owner + "]" : "";
    var sinceTag = w.since ? " [since: " + w.since + "]" : "";
    return "- [" + check + "] " + w.description + ownerTag + sinceTag;
  }).join("\n") + "\n";
}
function parseEventTime(timeStr, dateOffset) {
  if (!timeStr) return null;
  var m = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return null;
  var hr = parseInt(m[1], 10);
  var min = parseInt(m[2], 10);
  var ampm = m[3].toUpperCase();
  if (ampm === "PM" && hr !== 12) hr += 12;
  if (ampm === "AM" && hr === 12) hr = 0;
  var now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + (dateOffset || 0), hr, min, 0);
}
function formatCountdown(ms) {
  if (ms <= 0) return "now";
  var totalSec = Math.floor(ms / 1000);
  var hours = Math.floor(totalSec / 3600);
  var mins = Math.floor((totalSec % 3600) / 60);
  var secs = totalSec % 60;
  if (hours > 0) return hours + "h " + mins + "m";
  if (mins > 0) return mins + "m " + secs + "s";
  return secs + "s";
}
function formatRelativeTime(isoStr) {
  if (!isoStr) return "";
  var age = Date.now() - new Date(isoStr).getTime();
  var mins = Math.floor(age / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}
function mcFormatTimeAgo(timestamp) {
  if (!timestamp) return "";
  var age = Date.now() - (typeof timestamp === "number" ? timestamp : new Date(timestamp).getTime());
  var mins = Math.floor(age / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}

// --- Terminal Tab Component ---
function TerminalTab(props) {
  var visible = props.visible;
  var ptyId = props.ptyId;
  var containerRef = React.useRef(null);
  var terminalRef = React.useRef(null);
  var fitAddonRef = React.useRef(null);
  var initRef = React.useRef(false);

  React.useEffect(function() {
    if (initRef.current || !containerRef.current || !ptyId) return;
    initRef.current = true;
    var terminal = new window.Terminal({ theme: { background: "#000", foreground: "#d4d4d4", cursor: "#d4d4d4" }, fontSize: 13, fontFamily: "'Cascadia Code', 'Consolas', 'Courier New', monospace", cursorBlink: true });
    var fitAddon = new window.FitAddon.FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(containerRef.current);
    terminalRef.current = terminal;
    fitAddonRef.current = fitAddon;

    // Delayed fits for proper sizing
    function doFit() { try { var el = containerRef.current; if (el && el.offsetWidth > 100) { fitAddon.fit(); api.resizePty(ptyId, terminal.cols, terminal.rows); } } catch(e) {} }
    setTimeout(doFit, 50);
    setTimeout(doFit, 200);
    setTimeout(doFit, 500);

    // User input -> PTY
    terminal.onData(function(data) { api.writePty(ptyId, data); });

    // PTY output -> terminal
    function onData(id, data) { if (id === ptyId) terminal.write(data); }
    api.onPtyData(onData);

    // Resize observer
    var resizeObserver = new ResizeObserver(function() {
      try { var el = containerRef.current; if (el && el.offsetWidth > 100) { fitAddon.fit(); api.resizePty(ptyId, terminal.cols, terminal.rows); } } catch(e) {}
    });
    resizeObserver.observe(containerRef.current);

    return function() { resizeObserver.disconnect(); terminal.dispose(); };
  }, [ptyId]);

  // Re-fit when visibility changes
  React.useEffect(function() {
    if (visible && fitAddonRef.current) {
      function vfit() { try { var el = containerRef.current; if (el && el.offsetWidth > 100) { fitAddonRef.current.fit(); if (terminalRef.current) { api.resizePty(ptyId, terminalRef.current.cols, terminalRef.current.rows); terminalRef.current.scrollToBottom(); } } } catch(e) {} }
      setTimeout(vfit, 50);
      setTimeout(vfit, 200);
    }
  }, [visible]);

  return h("div", {
    ref: containerRef,
    style: { flex: visible ? 1 : "none", width: "100%", minHeight: 0, overflow: "hidden", display: visible ? "flex" : "none", background: "#000" }
  });
}

            cursor: "pointer", fontSize: 13, WebkitAppRegion: "no-drag", borderRadius: 16,
            fontWeight: "bold", textTransform: "uppercase", letterSpacing: "1px", transition: "background 0.2s"
          }
        },
          h("span", null, tab.type === "dashboard" ? "\u2302 " : "\u25CF "),
          h("span", { style: { maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, tab.label),

            onMouseEnter: function(e) { e.currentTarget.style.color = "#ff3333"; },
            onMouseLeave: function(e) { e.currentTarget.style.color = isActive ? "#000" : "#cc6699"; }
          }, "\u2715")
        );
      }),
      h("div", {
        onClick: function() { createTerminal(); },
        style: { padding: "0 14px", height: 32, display: "flex", alignItems: "center", background: "#9999cc", color: "#000", cursor: "pointer", fontSize: 16, WebkitAppRegion: "no-drag", borderRadius: 16, fontWeight: "bold" },
        onMouseEnter: function(e) { e.currentTarget.style.background = "#ff9900"; },
        onMouseLeave: function(e) { e.currentTarget.style.background = "#9999cc"; },
        title: "New terminal (Ctrl+T)"

    // LCARS right elbow

          slackContacts.filter(function(c) { return c.type === "dm"; }).map(function(c) { return h("option", { key: c.id, value: c.id }, c.name); })
        ),
        h("input", { value: slackRawText, onChange: function(e) { setSlackRawText(e.target.value); setSlackStatus(null); },
          onKeyDown: function(e) { if (e.key === "Enter" && slackRecipient && slackRawText.trim()) { setSlackDrafting(true); api.mcDraftSlack(slackRawText, (slackContacts.find(function(c) { return c.id === slackRecipient; }) || {}).name || "").then(function(d) { setSlackDraft(d); setSlackDrafting(false); }); } },
          placeholder: voiceListening ? "Listening..." : "What do you want to say?", style: Object.assign({}, inputStyle, { flex: 1, borderColor: voiceListening ? "#cc3333" : "#334455" }) }),
        h("button", {
          onClick: voiceToggle,
          style: { background: voiceListening ? "#cc3333" : "none", border: "1px solid " + (voiceListening ? "#cc3333" : "#667788"), borderRadius: 3, color: voiceListening ? "#fff" : "#667788", cursor: "pointer", fontSize: 13, padding: "4px 8px", lineHeight: 1, animation: voiceListening ? "pulse 1.5s infinite" : "none", userSelect: "none" }
        }, "\uD83C\uDF99"),
        h("button", {
          onClick: function() {
            if (!slackRecipient || !slackRawText.trim()) return;
            setSlackDrafting(true); setSlackDraft(""); setSlackStatus(null);
            api.mcDraftSlack(slackRawText, (slackContacts.find(function(c) { return c.id === slackRecipient; }) || {}).name || "").then(function(d) { setSlackDraft(d); setSlackDrafting(false); });
          },
          disabled: !slackRecipient || !slackRawText.trim() || slackDrafting,
          style: Object.assign({}, btnStyle, { opacity: !slackRecipient || !slackRawText.trim() ? 0.4 : 1, background: "#e06c75", fontSize: 11, padding: "6px 14px" })
        }, slackDrafting ? "Drafting..." : "Draft")
      ),
      slackDraft && h("div", { style: { background: "#000", borderRadius: 4, padding: "10px 12px", border: "1px solid #cc6699", marginBottom: 8 } },
        h("div", { style: { color: "#7788aa", fontSize: 10, marginBottom: 4 } }, "DRAFT PREVIEW"),
        h("textarea", { value: slackDraft, onChange: function(e) { setSlackDraft(e.target.value); }, style: { width: "100%", background: "transparent", border: "none", color: "#e8e8e8", fontSize: 12, lineHeight: "18px", resize: "vertical", minHeight: 40, outline: "none", fontFamily: "inherit" } }),
        h("div", { style: { display: "flex", gap: 8, marginTop: 8, alignItems: "center" } },
          h("button", {
            onClick: function() {
              setSlackSending(true); setSlackStatus(null);
              var recipientName = (slackContacts.find(function(c) { return c.id === slackRecipient; }) || {}).name || "";
              api.mcSendSlack(slackRecipient, slackDraft).then(function(res) {
                setSlackSending(false);
                if (res.ok) {
                  setSlackStatus("Sent to " + recipientName);
                  setSlackDraft(""); setSlackRawText("");
                  logTimeSaved("slack-send");
                  setTimeout(function() { setSlackStatus(null); }, 5000);
                }
                else { setSlackStatus("error: " + (res.error || "unknown")); }
              }).catch(function() { setSlackSending(false); setSlackStatus("error"); });
            },
            disabled: slackSending,
            style: Object.assign({}, btnStyle, { background: "#9999cc", fontSize: 11, padding: "5px 16px" })
          }, slackSending ? "Sending..." : "Send"),
          h("button", { onClick: function() { setSlackDraft(""); }, style: Object.assign({}, btnSmall, { fontSize: 10 }) }, "Discard")
        )
      ),
      !slackDraft && slackStatus && h("div", { style: { padding: "6px 10px", borderRadius: 4, marginTop: 4, background: slackStatus.startsWith("error") ? "#2a1015" : "#0a2015", border: "1px solid " + (slackStatus.startsWith("error") ? "#f44747" : "#89d185"), display: "flex", alignItems: "center", gap: 6 } },
        h("span", { style: { fontSize: 13 } }, slackStatus.startsWith("error") ? "\u2718" : "\u2714"),
        h("span", { style: { color: slackStatus.startsWith("error") ? "#f44747" : "#89d185", fontSize: 11 } }, slackStatus)
      )
    ),

    // LCARS divider
    h("div", { style: lcarsDivider() },
      h("div", { style: lcarsBar("#9999cc", 1, "left") }),
      h("div", { style: lcarsBar("#cc9966", 2) }),
      h("div", { style: lcarsBar("#ff9966", 3) }),
      h("div", { style: lcarsBar("#cc6699", 1, "right") })
    ),

    // Waiting On + Slack Pulse
    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 4 } },
      h("div", { style: lcarsPanel("#ffcc66", "#ffcc66") },
        h("div", { style: { color: "#ffcc66", fontSize: 11, marginBottom: 10, textTransform: "uppercase", display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("span", null, "Waiting On (" + waitingOn.filter(function(w) { return !w.done; }).length + ")"),
          h("button", { onClick: function() { loadWaiting(); }, style: Object.assign({}, btnSmall, { fontSize: 9, padding: "2px 6px" }) }, "\u21BB")
        ),
        h("div", { style: { display: "flex", gap: 6, marginBottom: 8 } },
          h("input", { value: newWaitingText, onChange: function(e) { setNewWaitingText(e.target.value); },
            onKeyDown: function(e) { if (e.key === "Enter" && newWaitingText.trim()) { var ts = new Date().toISOString().slice(0, 10); saveWaiting([{ done: false, description: newWaitingText.trim(), owner: newWaitingOwner.trim(), since: ts }].concat(waitingOn)); setNewWaitingText(""); setNewWaitingOwner(""); } },
            placeholder: "What are you waiting on?", style: Object.assign({}, inputStyle, { flex: 1, minWidth: 100 }) }),
          h("input", { value: newWaitingOwner, onChange: function(e) { setNewWaitingOwner(e.target.value); }, placeholder: "Who?", style: Object.assign({}, inputStyle, { width: 80 }) }),
          h("button", { onClick: function() { if (!newWaitingText.trim()) return; var ts = new Date().toISOString().slice(0, 10); saveWaiting([{ done: false, description: newWaitingText.trim(), owner: newWaitingOwner.trim(), since: ts }].concat(waitingOn)); setNewWaitingText(""); setNewWaitingOwner(""); }, style: btnStyle }, "Add")
        ),
        waitingOn.filter(function(w) { return !w.done; }).length === 0 && h("div", { style: { color: "#667788", fontSize: 12, padding: "4px 0" } }, "Nothing pending."),
        waitingOn.filter(function(w) { return !w.done; }).map(function(w, i) {
          var daysSince = w.since ? Math.round((Date.now() - new Date(w.since).getTime()) / 86400000) : null;
          var isStale = daysSince !== null && daysSince > 7;
          var ownerContact = slackContacts.find(function(c) { return c.type === "dm" && w.owner && c.name.toLowerCase().includes(w.owner.split(" ")[0].toLowerCase()); });
          return h("div", { key: "wait-" + i, style: { padding: "5px 0", borderBottom: "1px solid #332244", display: "flex", gap: 8, alignItems: "center" } },
            h("input", { type: "checkbox", checked: false, onChange: function() { saveWaiting(waitingOn.map(function(ww, j) { return ww === w ? Object.assign({}, ww, { done: true }) : ww; })); }, style: { cursor: "pointer", accentColor: "#e5c07b" } }),
            h("div", { style: { flex: 1, minWidth: 0 } },
              h("div", { style: { color: "#ccbbaa", fontSize: 12 } }, w.description),
              h("div", { style: { display: "flex", gap: 8, alignItems: "center", marginTop: 1 } },
                w.owner && h("span", { style: { color: "#ffcc66", fontSize: 10 } }, "@" + w.owner),
                daysSince !== null && h("span", { style: { color: isStale ? "#f44747" : "#666", fontSize: 10, fontWeight: isStale ? "bold" : "normal" } }, daysSince === 0 ? "today" : daysSince + "d ago")
              )
            ),
            ownerContact && h("button", { onClick: function() { setSlackRecipient(ownerContact.id); setSlackRawText("Following up on: " + w.description); logTimeSaved("waiting-nudge"); }, style: Object.assign({}, btnSmall, { fontSize: 9, color: "#ffcc66", border: "1px solid #ffcc66" }) }, "Nudge"),
            h("button", { onClick: function() { saveWaiting(waitingOn.filter(function(ww) { return ww !== w; })); }, style: Object.assign({}, btnSmall, { color: "#cc3333", fontSize: 9 }) }, "x")
          );
        })
      ),
      // Slack Pulse
      h("div", { style: lcarsPanel("#9999ff", "#9999ff") },
        h("div", { style: { color: "#9999ff", fontSize: 11, marginBottom: 10, textTransform: "uppercase", display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("span", null, "Slack Pulse"),
          h("button", { onClick: function() { api.mcSlackPulse(true).then(function(d) { if (d && d.channels) setSlackPulse(d.channels); }); }, style: Object.assign({}, btnSmall, { fontSize: 9, padding: "2px 6px" }) }, "\u21BB")
        ),
        slackPulse.length === 0 && h("div", { style: { color: "#667788", fontSize: 12, padding: "4px 0", fontStyle: "italic" } }, "Configure pulseChannels in config to see activity."),
        slackPulse.map(function(ch, i) {
          return h("div", { key: "sp-" + i, style: { padding: "6px 0", borderBottom: i < slackPulse.length - 1 ? "1px solid #3e3e3e" : "none" } },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
              h("span", { style: { color: "#9999ff", fontSize: 12 } }, ch.channel || ch.channelId),
              h("span", { style: { display: "flex", gap: 6, alignItems: "center" } },
                ch.hasMention && h("span", { style: { background: "#cc3333", color: "#fff", fontSize: 8, fontWeight: "bold", padding: "1px 4px", borderRadius: 3 } }, "@"),
                h("span", { style: { color: ch.todayCount > 0 ? "#e5c07b" : "#666", fontSize: 11 } }, ch.todayCount > 0 ? ch.todayCount + " today" : "quiet")
              )
            ),
            ch.latestMessage && h("div", { style: { color: "#667788", fontSize: 10, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, ch.latestMessage)
          );
        })
      )
    ),

    // LCARS divider
    h("div", { style: lcarsDivider() },
      h("div", { style: lcarsBar("#ff9900", 2, "left") }),
      h("div", { style: lcarsBar("#9999cc", 1) }),
      h("div", { style: lcarsBar("#cc9966", 3) }),
      h("div", { style: lcarsBar("#cc6699", 1, "right") })
    ),

    // Recent Sessions + Skills
    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 } },
      h("div", { style: Object.assign({}, lcarsPanel("#cc9966", "#cc9966"), { display: "flex", flexDirection: "column" }) },
        h("div", { style: { color: "#7788aa", fontSize: 11, marginBottom: 12, textTransform: "uppercase", display: "flex", justifyContent: "space-between" } },
          h("span", null, "Recent Sessions"),
          recentSessions.length > 0 && h("span", { style: { color: "#556677", fontSize: 10, textTransform: "none" } }, recentSessions.length + " sessions")
        ),
        h("div", { style: { maxHeight: 340, overflowY: "auto", flex: 1 } },
          recentSessions.length === 0 && h("div", { style: { color: "#667788", padding: "8px 0" } }, "No recent sessions"),
          recentSessions.map(function(session, i) {
            var title = session.name || session.projectPath.split(/[\\/]/).pop() || "Session";
            var projLabel = session.projectPath.replace(/^[A-Z]:\\Users\\[^\\]+\\/, "~\\").replace(/^\/Users\/[^/]+\//, "~/");
            var msgBadge = session.msgCount ? session.msgCount + " msgs" : "";
            return h("div", { key: session.sessionId || session.projectPath, onClick: function() { handleSessionClick(session); },
              style: { padding: "6px 0", borderBottom: i < recentSessions.length - 1 ? "1px solid #3e3e3e" : "none", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", borderRadius: 3 },
              onMouseEnter: function(e) { e.currentTarget.style.background = "#1a1a2e"; },
              onMouseLeave: function(e) { e.currentTarget.style.background = ""; }
            },
              h("div", { style: { flex: 1, minWidth: 0 } },
                h("div", { style: { color: "#ff9900", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, title),
                h("div", { style: { color: "#556677", fontSize: 10 } }, projLabel + (msgBadge ? " \u00B7 " + msgBadge : ""))
              ),
              h("span", { style: { color: "#7788aa", fontSize: 10, flexShrink: 0, marginLeft: 8 } }, mcFormatTimeAgo(session.lastOpened))
            );
          })
        )
      ),
      h("div", { style: lcarsPanel("#cc99cc", "#cc99cc") },
        h("div", { style: { color: "#cc99cc", fontSize: 11, marginBottom: 8, textTransform: "uppercase", display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("span", null, "Skills"),
          h("input", { "data-mc-skill-filter": true, value: skillFilter, onChange: function(e) { setSkillFilter(e.target.value); }, placeholder: "Filter...", style: Object.assign({}, inputStyle, { width: 100, fontSize: 10, padding: "3px 6px" }) })
        ),
        h("div", { style: { maxHeight: 340, overflowY: "auto" } },
          filteredCategories.map(function(cat) {
            return h("div", { key: cat.label },
              h("div", { style: { color: "#556677", fontSize: 9, textTransform: "uppercase", letterSpacing: "0.5px", padding: "6px 4px 2px", borderBottom: "1px solid #332244" } }, cat.label),
              cat.skills.map(function(skill) {
                return h("div", { key: skill.cmd, onClick: function() { runCommand(skill.cmd); },
                  style: { display: "flex", padding: "4px 4px", gap: 6, alignItems: "baseline", cursor: "pointer", borderRadius: 3 },
                  onMouseEnter: function(e) { e.currentTarget.style.background = "#1a1a2e"; },
                  onMouseLeave: function(e) { e.currentTarget.style.background = ""; }
                },
                  h("code", { style: { color: "#cc99cc", fontSize: 11, whiteSpace: "nowrap", flexShrink: 0, fontFamily: "'Orbitron', 'Cascadia Code', Consolas, monospace" } }, skill.cmd),
                  h("span", { style: { color: "#667788", fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, skill.desc)
                );
              })
            );
          })
        )
      )
    )
  );
}

// --- Mount ---
ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
