version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gusto-treasury-db
    environment:
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: treasury_dev_password
      POSTGRES_DB: gusto_treasury
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury -d gusto_treasury"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gusto-treasury-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development mail server for testing email flows
  mailhog:
    image: mailhog/mailhog
    container_name: gusto-treasury-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: gusto-treasury-network
